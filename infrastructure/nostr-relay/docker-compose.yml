version: '3.8'

services:
  # US Relay (Wyoming)
  relay-us:
    image: rustdocker/nostr-rs-relay:latest
    container_name: tadbuy-relay-us
    restart: unless-stopped
    ports:
      - "7070:8080"
    volumes:
      - ./data/us-wyoming:/data
      - ./relay-configs/us-wyoming.toml:/config.toml:ro
    environment:
      - RUST_LOG=info
    networks:
      - tadbuy-nostr

  # Japan Relay
  relay-jp:
    image: rustdocker/nostr-rs-relay:latest
    container_name: tadbuy-relay-jp
    restart: unless-stopped
    ports:
      - "7071:8080"
    volumes:
      - ./data/japan:/data
      - ./relay-configs/japan.toml:/config.toml:ro
    environment:
      - RUST_LOG=info
    networks:
      - tadbuy-nostr

  # Germany Relay
  relay-de:
    image: rustdocker/nostr-rs-relay:latest
    container_name: tadbuy-relay-de
    restart: unless-stopped
    ports:
      - "7072:8080"
    volumes:
      - ./data/germany:/data
      - ./relay-configs/germany.toml:/config.toml:ro
    environment:
      - RUST_LOG=info
    networks:
      - tadbuy-nostr

  # Netherlands Relay
  relay-nl:
    image: rustdocker/nostr-rs-relay:latest
    container_name: tadbuy-relay-nl
    restart: unless-stopped
    ports:
      - "7073:8080"
    volumes:
      - ./data/netherlands:/data
      - ./relay-configs/netherlands.toml:/config.toml:ro
    environment:
      - RUST_LOG=info
    networks:
      - tadbuy-nostr

  # Portugal Relay
  relay-pt:
    image: rustdocker/nostr-rs-relay:latest
    container_name: tadbuy-relay-pt
    restart: unless-stopped
    ports:
      - "7074:8080"
    volumes:
      - ./data/portugal:/data
      - ./relay-configs/portugal.toml:/config.toml:ro
    environment:
      - RUST_LOG=info
    networks:
      - tadbuy-nostr

  # Singapore Relay
  relay-sg:
    image: rustdocker/nostr-rs-relay:latest
    container_name: tadbuy-relay-sg
    restart: unless-stopped
    ports:
      - "7075:8080"
    volumes:
      - ./data/singapore:/data
      - ./relay-configs/singapore.toml:/config.toml:ro
    environment:
      - RUST_LOG=info
    networks:
      - tadbuy-nostr

  # El Salvador Relay
  relay-sv:
    image: rustdocker/nostr-rs-relay:latest
    container_name: tadbuy-relay-sv
    restart: unless-stopped
    ports:
      - "7076:8080"
    volumes:
      - ./data/el-salvador:/data
      - ./relay-configs/el-salvador.toml:/config.toml:ro
    environment:
      - RUST_LOG=info
    networks:
      - tadbuy-nostr

  # Argentina Relay (Spanish-speaking)
  relay-ar:
    image: rustdocker/nostr-rs-relay:latest
    container_name: tadbuy-relay-ar
    restart: unless-stopped
    ports:
      - "7077:8080"
    volumes:
      - ./data/argentina:/data
      - ./relay-configs/argentina.toml:/config.toml:ro
    environment:
      - RUST_LOG=info
    networks:
      - tadbuy-nostr

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:latest
    container_name: tadbuy-relay-proxy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - relay-us
    networks:
      - tadbuy-nostr

networks:
  tadbuy-nostr:
    driver: bridge