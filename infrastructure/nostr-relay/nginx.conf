# Nginx Configuration for Nostr Relays
# This file provides reverse proxy for all 8 regional relays

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 16M;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # Performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/atom+xml image/svg+xml;

    # WebSocket support for Nostr
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=nostr_limit:10m rate=10r/s;

    # Upstream definitions
    upstream relay_us {
        server relay-us:8080;
        keepalive 16;
    }

    upstream relay_jp {
        server relay-jp:8080;
        keepalive 16;
    }

    upstream relay_de {
        server relay-de:8080;
        keepalive 16;
    }

    upstream relay_nl {
        server relay-nl:8080;
        keepalive 16;
    }

    upstream relay_pt {
        server relay-pt:8080;
        keepalive 16;
    }

    upstream relay_sg {
        server relay-sg:8080;
        keepalive 16;
    }

    upstream relay_sv {
        server relay-sv:8080;
        keepalive 16;
    }

    upstream relay_ar {
        server relay-ar:8080;
        keepalive 16;
    }

    # HTTP to HTTPS redirect
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # US Relay (Wyoming)
    server {
        listen 443 ssl http2;
        server_name us.tadbuy.io;

        ssl_certificate /etc/nginx/certs/us.tadbuy.io.pem;
        ssl_certificate_key /etc/nginx/certs/us.tadbuy.io.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            limit_req zone=nostr_limit burst=20 nodelay;

            proxy_pass http://relay_us;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }

